[project]
name = "cottage_analysis"
version = "v2.1.0"
urls = { repository = "https://github.com/znamlab/cottage_analysis" }
license = "MIT"
authors = [
{name = "Antonin Blot", email = "antonin.blot@crick.ac.uk"},
{name = "Yiran He"},
{name = "Petr Znamenskiy"}
]
description = "Common functions for analysis"
dependencies = [
	"numpy",
	"pandas",
	"pathlib",
	"matplotlib",
	"scipy",
	"tables",
	"scikit-learn",
	"tqdm",
	"numba",
	"numba_progress",
	"scikit-image",
	"defopt",
	"black",
	"tqdm",
	"plotly",
	"natsort",
	"roifile",
	"probeinterface",
	"spikeinterface",
	"lxml",
	"pyarrow",
	"fastparquet",
	"seaborn",
	"flexiznam @ git+ssh://git@github.com/znamlab/flexiznam.git",
	"znamutils @ git+ssh://git@github.com/znamlab/znamutils.git",
	]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cottage_analysis"]
namespaces = false
