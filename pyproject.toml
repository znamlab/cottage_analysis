[project]
name = "cottage_analysis"
version = "2.1.1"
description = "Common functions for analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
urls = { repository = "https://github.com/znamlab/cottage_analysis" }
authors = [
    { name = "Antonin Blot", email = "antonin.blot@crick.ac.uk" },
    { name = "Yiran He" },
    { name = "Petr Znamenskiy" },
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "tables",
    "scikit-learn",
    "tqdm",
    "numba",
    "numba_progress",
    "scikit-image",
    "defopt",
    "plotly",
    "natsort",
    "roifile",
    "probeinterface",
    "spikeinterface",
    "lxml",
    "pyarrow",
    "fastparquet",
    "seaborn",
    "flexiznam @ git+ssh://git@github.com/znamlab/flexiznam.git",
    "znamutils @ git+ssh://git@github.com/znamlab/znamutils.git",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cottage_analysis*"]
exclude = ["tests*"]
namespaces = false
